    
- name: Enable OpenSSH
  ansible.windows.win_service: 
    name: sshd
    start_mode: auto
    state: started
  when: ansible_os_family == "Windows"
      
- name: Copy public key to hello_admin
  ansible.windows.win_copy:
    content: "{{my_public_key}}"
    dest: '%ProgramData%\ssh\administrators_authorized_keys'
    force: false
  when: ansible_os_family == "Windows"

- name: disallow password login on remote host
  ansible.windows.win_copy:
    src: sshd_config 
    dest: '%ProgramData%\ssh\sshd_config'
    force: True
  notify: restart sshd
  when: ansible_os_family == "Windows"

- ansible.windows.win_region:
    location: 77 #Finland
  when: ansible_os_family == "Windows"

- ansible.windows.win_timezone: 
    timezone: FLE Standard Time
  when: ansible_os_family == "Windows"
  
- name: Download all updates
  ansible.windows.win_updates:
    category_names: '*' 
    state: downloaded
  notify: Install critical updates
  when: ansible_os_family == "Windows"

