---
# Add user
- name: Add user block
  block:

    - name: Create user
      user:
        name: "{{ username }}"
        state: present
        shell: /bin/bash
        create_home: yes
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: yes



    - name: Ensure SSH directory exists
      file:
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0700"

    - name: Add SSH key
      authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ ssh_key }}"
      when: ssh_key is defined and ssh_key | length > 0

    - name: SSH key is missing!
      fail:
        msg: "ssh_key is missing!!!!"
      when: ssh_key is not defined or ssh_key | length == 0


    - name: Add sudoers entry
      copy:
        dest: "/etc/sudoers.d/{{ username }}"
        content: "{{ username }} ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
        validate: 'visudo -cf %s'

# del old user
