# HOSTNAME
- name: Set hostname
  hostname:
    name: "{{ hostname }}"

- name: Fix /etc/hosts entry
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"
